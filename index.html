<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#fcfcfa">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="《世界計畫》台服活動劇情的條漫閱讀器">
<!-- Share previews: crawlers run no JS and drop the #route, so every shared link gets this one card. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="SEKAI 劇情閱讀器">
<meta property="og:title" content="SEKAI 劇情閱讀器">
<meta property="og:description" content="《世界計畫》台服活動劇情，改編成手機直讀的條漫。非官方粉絲專案。">
<meta property="og:url" content="https://sekai-reader.pages.dev/">
<meta property="og:image" content="https://sekai-reader.pages.dev/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="SEKAI 劇情閱讀器：台服活動劇情的條漫閱讀器">
<meta property="og:locale" content="zh_TW">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Not render-blocking: the page paints in fallback fonts, and the comic refits its bubbles on each web-font load (src/render/comic/index.ts). -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@900&family=Huninn&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@900&family=Huninn&display=swap"></noscript>
<title>SEKAI 劇情閱讀器</title>
<script>
/* Before first paint, so a dark-mode reader never sees a white flash; same rule as src/app/theme.ts. */
(function () {
  var dark = null;
  try { var v = JSON.parse(localStorage.getItem('sekai-reader:dark')); if (typeof v === 'boolean') dark = v; } catch (e) {}
  if (dark === null) { try { dark = Boolean(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { dark = false; } }
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', dark ? '#14181e' : '#fcfcfa');
})();
</script>
</head>
<body>
<div id="app"></div>
<div class="curtain" aria-hidden="true" data-curtain>
<svg class="c-l" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0 H100 C82 25, 82 75, 100 100 H0 Z"/></svg>
<svg class="c-r" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M100 0 H0 C18 25, 18 75, 0 100 H100 Z"/></svg>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
