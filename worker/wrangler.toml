# Cloudflare Worker that starts the pipeline workflow every hour (see worker/index.ts).
# Deploy: bash scripts/pipeline/setup-cron.sh (sets the GH_DISPATCH_TOKEN secret too).
name = "sekai-reader-cron"
main = "index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

[vars]
REPO = "cholateio/sekai-reader"

[triggers]
crons = ["23 * * * *"]
